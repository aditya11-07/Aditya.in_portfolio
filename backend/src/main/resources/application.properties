# ===================================================================
# Aditya Pandey Portfolio - Backend Configuration
# ===================================================================

server.port=8085
server.servlet.context-path=/

# Application Identity
spring.application.name=aditya-portfolio-backend

# CORS Configuration
portfolio.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://aditya11-07.github.io

# Actuator Health Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.aditya.portfolio=INFO
logging.level.org.springframework.web=INFO
